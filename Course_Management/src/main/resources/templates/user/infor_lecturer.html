<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<head th:replace="user/common/head :: head"></head>
<body>
<div id="wrapper" class="horizontal">
    <div th:replace="user/common/header :: header"></div>
    <!-- Main Contents -->
    <div>
        <div style="height: 250px"
             class="absolute bg-gradient-to-l from-blue-400 h-52 left-0 to-blue-500 top-0 via-blue-400 w-full"></div>

        <div class="py-1 z-15 relative" style="width: 1528px">
            <div class="container mx-auto mt-10">
                <div class="xl:flex xl:space-x-10">

                    <div class="xl:w-1/3" id="profileLecturer">


                    </div>

                    <div class="flex-1 bg-white shadow-md rounded-xl xl:mt-0 mt-10">

                        <div class="border-b items-end justify-between mb-6 sm:flex">
                            <div class="flex-1 mb-3 md:mb-0 p-5 pb-0">
                                <div class="font-semibold text-lg"> Các khóa học của tôi</div>
                            </div>
                            <div class="flex items-center p-5 space-x-3">
                                <div class="bg-gray-100 border inline-flex p-0.5 rounded-md text-lg fliter-tab"
                                     uk-switcher="connect: #course-tabs; animation: uk-animation-fade">
                                    <a href="#" class="py-1.5 px-2.5 rounded-md" data-tippy-placement="top"
                                       title="Grid view">
                                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"
                                             xmlns="http://www.w3.org/2000/svg">
                                            <path fill-rule="evenodd"
                                                  d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                                                  clip-rule="evenodd"></path>
                                        </svg>
                                    </a>
                                    <a href="#" class="py-1.5 px-2.5 rounded-md" data-tippy-placement="top"
                                       title="List view">
                                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"
                                             xmlns="http://www.w3.org/2000/svg">
                                            <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                                        </svg>
                                    </a>
                                </div>

                            </div>
                        </div>

                        <!-- my course list -->
                        <div class="p-6 pt-0">

                            <div class="uk-switcher" id="course-tabs">
                                <ul class="divide-y -mt-5" id="list_mycourse">
                                </ul>
                                <div class="grid md:grid-cols-2 gap-6" id="listCourse2">
                                </div>
                            </div>

                            <div class="mt-6">
                                <ul class="pagination justify-center" id="pageId">
                                </ul>
                            </div>

                        </div>


                    </div>

                </div>

            </div>

        </div>



    </div>
</div>
<div th:replace="user/common/script :: script"></div>
<script>
    $(document).ready(function () {
        initData()
    })

    function initData() {
        let page = 0;
        let size = 4;
        getProfileLecturer()
        countCourseByAccountId()
        getCourseByAccount(page, size)
        getCourseByAccount2(page,size)
        getCountComment()
    }

    function getProfileLecturer() {
        let profile = $('#profileLecturer')
        profile.empty()
        let accountId = new URLSearchParams(window.location.search).get('idAccount');
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/account/admin/search/" + accountId,
            dataType: "json",
            success: function (response) {
                let data = response;
                let birthdayString = data.data.birthday;
                let birthday = new Date(birthdayString);
                let day = String(birthday.getDate()).padStart(2, '0');
                let month = String(birthday.getMonth() + 1).padStart(2, '0');
                let year = birthday.getFullYear();
                let formattedBirthday = `${day}/${month}/${year}`;

                let html = '  <div class="bg-white shadow-md rounded-xl p-4">' +
                    '<div class="h-28 w-28 mt-3 mx-auto relative rounded-full overflow-hidden">' +
                    '<img src="' + (data.data.image.length > 0 ? 'data:image/png;base64,' + data.data.image : '../assets/images/courses/img-5.jpg') + '" alt="" class="h-full w-full inset-0 object-cover rounded-full">' +
                    '</div>' +
                    '<div class="text-center p-4">' +
                    '<h2 class="text-xl font-semibold"> ' + data.data.fullname + '</h2>' +
                    '<h6 class="text-sm font-medium text-gray-600"> ' + data.data.email + '</h6>' +
                    '</div>' +
                    '<div class="font-medium mt-2">' +
                    '<div class="flex items-center py-2 space-x-3">' +
                    '<div class="flex flex-1">' +
                    '<ion-icon name="play-circle-outline" class="text-xl mr-3 md hydrated" role="img" aria-label="play circle outline"></ion-icon> Khóa học' +
                    '</div>' +
                    '<div class="text-black" id="count">   </div>' +
                    '</div>' +
                    '<div class="flex items-center py-2 space-x-3">' +
                    '<div class="flex flex-1">' +
                    '<ion-icon name="map-outline" class="text-xl mr-3 md hydrated" role="img" aria-label="play circle outline"></ion-icon>Ngày sinh ' +
                    '</div>' +
                    '<div class="text-black">  ' + formattedBirthday  + ' </div>' +
                    '</div>' +
                    '<div class="flex items-center py-2 space-x-3">' +
                    '<div class="flex flex-1">' +
                    '<ion-icon name="people-outline" class="text-xl mr-3 md hydrated" role="img" aria-label="people outline"></ion-icon> Tổng sinh viên' +
                    '</div>' +
                    '<div class="text-black">  1000 </div>' +
                    '</div>' +
                    '<div class="flex items-center py-2 space-x-3">' +
                    '<div class="flex flex-1">' +
                    '<ion-icon name="medal-outline" class="text-xl mr-3 md hydrated" role="img" aria-label="medal outline"></ion-icon> Đánh giá' +
                    '</div>' +
                    '<div class="text-black" id="countComment">   </div>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="bg-white shadow-md rounded-xl py-2 divide-y divide-gray-100 mt-6">' +
                    '<a class="flex space-x-2 px-4 py-3 hover:bg-gray-50">' +
                    '<div class="flex-1 pl-1">' +
                    '<div class="text-red-600">Mô tả</div>' +
                    '<div class="text-sm mt-1.5 leading-5 text-gray-500" id="descrip_list"> </div>' +
                    '</div>' +
                    '</a>' +
                    '</div>';
                profile.append(html);
                renderDescription(data.data.description)
                console.log('profile data', data)

            }
        })
    }



    function renderDescription(description) {
        const listElement = document.getElementById('descrip_list');
        listElement.innerHTML = '';

        if (description) {
            const lines = description.split('\n');
            lines.forEach(line => {
                const listItem = document.createElement('li');
                listItem.textContent = line.trim();
                listElement.appendChild(listItem);
            });
        } else {
            console.error("error");
        }
    }


    function countCourseByAccountId() {
        let accountId = new URLSearchParams(window.location.search).get('idAccount');
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/course/countSourse/" + accountId,
            dataType: "json",
            success: function (response) {
                $('#count').text(response.data)
                console.log('number', response)
            }
        })
    }

    function getCourseByAccount(page, size) {
        let list_course = $('#list_mycourse')
        let accountId = new URLSearchParams(window.location.search).get('idAccount');
        list_course.empty()
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/course/findByAccountId/"+accountId+"?page="+ page + "&size=" + size,
            dataType: "json",
            success: function (response) {
                console.log('course by account id', response);
                let myCourse = response?.data?.content;
                for (let i = 0; i < myCourse.length; i++) {
                    let data = myCourse[i]
                    let html = '<li class="flex items-start md:space-x-6 space-x-3 md:py-4 py-3">' +
                        '<a href="/course/detail_course?id=' + data.id + '">' +
                        '<div class="h-12 md:h-16 md:w-24 overflow-hidden relative rounded -md w-12">' +
                        '<img src="' + (data.imageFile.length > 0 ? 'data:image/png;base64,' + data.imageFile : '../assets/images/courses/img-5.jpg') + '" alt="" class="w-full h-full absolute inset-0 object-cover">' +
                        '</div>' +
                        '</a>' +
                        '<div class="flex flex-1 items-end justify-between space-x-5">' +
                        '<div class="flex-1">' +
                        '<a href="/course/detail_course?id=' + data.id + '" class="md:text-base font-semibold line-clamp-1"> '+data.name+' </a>' +
                        '<div class="mt-1.5">' +
                        '<div class="mb-1.5 text-gray-400 text-sm"> '+data.shortDescription+' </div>' +
                        '<div class="mb-1.5 text-gray-400 text-sm"> Ngôn ngữ : <span>'+data.languageName+'</span> </div>' +
                        '</div>' +
                        '</div>' +
                        '</div>' +
                        '</li>';
                    list_course.append(html)
                }
                let totalPage = response.data.totalPages;
                let currentPage = response.data.pageable.pageNumber;
                if (totalPage > 0) {
                    $("#pageId").empty();
                    let pages = '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage - 1) + ',4,event)" href="#">Previous</a></li>';
                    for (let i = 0; i < totalPage; i++) {
                        if (currentPage === i) {
                            pages += '<li class="page-item active"><a class="page-link" onclick="changePage(' + i + ',4,event)" href="#">' + (i + 1) + '</a></li>';
                        } else {
                            pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + i + ',4,event)" href="#">' + (i + 1) + '</a></li>';
                        }
                    }
                    pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage + 1) + ',4,event)" href="#">Next</a></li>';
                    $("#pageId").append(pages);
                }
            }
        })

    }
    function getCourseByAccount2(page,size){
        let list_course= $('#listCourse2')
        list_course.empty()
        let accountId = new URLSearchParams(window.location.search).get('idAccount');
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/course/findByAccountId/"+accountId+"?page="+ page + "&size=" + size,
            dataType: "json",
            success: function (response) {
                console.log('course by account id', response);
                let myCourse = response?.data?.content;
                for (let i = 0; i < myCourse.length; i++) {
                    let data = myCourse[i]
                    let html = ' <div class="bg-white overflow-hidden rounded-md shadow">' +
                        '<a href="/course/detail_course?id=' + data.id + '" id="demo">' +
                        '<div class="h-28 md:h-36 overflow-hidden relative w-full">' +
                        '<img src="' + (data.imageFile.length > 0 ? 'data:image/png;base64,' + data.imageFile : '../assets/images/courses/img-5.jpg') + '" class="w-full h-full absolute inset-0 object-cover">' +
                        '</div>' +
                        '</a>' +
                        '<div class="p-3">' +
                        '<a href="/course/detail_course?id=' + data.id + '" class="font-semibold line-clamp-2"> '+data.name+' </a>' +
                        '<div class="flex space-x-2 items-center text-sm pt-3">' +
                        '<div> '+data.duration+'Giờ</div>' +
                        '<div> ·</div>' +
                        '<div> 32 lectures</div>' +
                        '<div> ·</div>' +
                        '<div> '+data.levelName+'</div>' +
                        '</div>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
                    list_course.append(html)
                }
                let totalPage = response.data.totalPages;
                let currentPage = response.data.pageable.pageNumber;
                if (totalPage > 0) {
                    $("#pageId").empty();
                    let pages = '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage - 1) + ',4,event)" href="#">Previous</a></li>';
                    for (let i = 0; i < totalPage; i++) {
                        if (currentPage === i) {
                            pages += '<li class="page-item active"><a class="page-link" onclick="changePage(' + i + ',4,event)" href="#">' + (i + 1) + '</a></li>';
                        } else {
                            pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + i + ',4,event)" href="#">' + (i + 1) + '</a></li>';
                        }
                    }
                    pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage + 1) + ',4,event)" href="#">Next</a></li>';
                    $("#pageId").append(pages);
                }
            }
        })
    }
    function getCountComment(){
        let accountId = new URLSearchParams(window.location.search).get('idAccount');
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/comment/countComment/" + accountId,
            dataType: "json",
            success: function (response) {
                $('#countComment').text(response.data)
                console.log('number', response)
            }
        })
    }

    function changePage(page, size, event) {
        event.preventDefault();
        getCourseByAccount(page, size);
        getCourseByAccount2(page,size)
    }

</script>
</body>
</html>
