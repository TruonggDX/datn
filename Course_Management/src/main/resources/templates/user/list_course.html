<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="user/common/head :: head"></head>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div id="wrapper" class="horizontal">
    <div th:replace="user/common/header :: header"></div>
    <div class="container">

        <!-- Spacer -->
        <div class="page-spacer"></div>

        <div class="lg:flex lg:space-x-10">

            <div class="lg:w-3/12 space-y-4 lg:block hidden">

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="font-semibold text-base">Subcategory</h4>
                        <button id="clearAll" class="text-sm text-blue-500 hover:text-blue-700">Clear</button>
                    </div>

                    <select class="selectpicker default shadow-sm rounded" data-selected-text-format="count"
                            data-size="7" title="Tất cả danh mục" id="list_subCate">

                    </select>
                </div>

                <div>
                    <h4 class="font-semibold text-base mb-2"> Skill Levels</h4>
                    <form class="space-y-1" id="level_list">
                    </form>
                </div>

                <div>
                    <h4 class="font-semibold text-base">Ngôn ngữ</h4>
                    <select class="selectpicker default shadow-sm rounded" data-selected-text-format="count"
                            data-size="7" title="Tất cả ngôn ngữ" id="list_language">

                    </select>
                </div>
            </div>

            <div class="w-full md:space-y-10 space-y-5">
                <div>
                    <div class="md:flex justify-between items-center mb-8 pt-4 border-t">

                        <div>
                            <div class="text-xl font-semibold"> Các khóa học lập trình</div>
                            <div class="text-sm mt-2 font-medium text-gray-500 leading-6"> Choose from +10.000 courses
                                with new additions published every months
                            </div>
                        </div>

                        <div class="flex items-center justify-end">
                            <div class="w-40 lg:block hidden ml-3">
                                <select class="selectpicker is-small rounded-md shadow-sm" data-size="7">
                                    <option value="">Newest</option>
                                    <option value="1">Popular</option>
                                    <option value="2">Free</option>
                                    <option value="3">Paid</option>
                                </select>
                            </div>

                        </div>
                    </div>


                    <div class="grid lg:grid-cols-3 md:grid-cols-2 gap-5" id="listCourse">

                    </div>

                    <!-- Pagination -->
                    <div class="mt-6">
                        <ul class="pagination justify-center" id="pageId">
                        </ul>
                    </div>

                </div>

            </div>
        </div>
    </div>
    <div th:replace="user/common/footer :: footer"></div>


</div>

<div th:replace="user/common/script :: script"></div>
<script>
    $(document).ready(function () {
        initDataa()
    })
    let seacrchForm = {
        levelId: "",
        categoryId: "",
        languageId:"",
    }
    function initDataa() {
        let page = 0;
        let size = 9;
        getAllCourse(page, size);
        getLevel();
        getSubCate();
        getLanguage(page,size);
    }

    function getAllCourse(page, size) {
        let list_course = $('#listCourse');
        list_course.empty();

        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/course/list?page=" + page + "&size=" + size,
            dataType: "json",
            success: function (response) {
                let course = response?.data?.content;
                for (let i = 0; i < course.length; i++) {
                    let data = course[i];
                    let listId = 'benefit_list_' + data.id;
                    let courseHtml = `
                    <div class="course-container">
                        <a href="/course/detail_course?id=${data.id}" class="uk-link-reset course-card">
                            <div class="card uk-transition-toggle">
                                <div class="card-media h-40">
                                    <div class="card-media-overly"></div>
                                    <img src="${data.imageFile.length > 0 ? 'data:image/png;base64,' + data.imageFile[0] : '../assets/images/courses/img-5.jpg'}" alt="" class="">
                                </div>
                                <div class="card-body p-4">
                                    <div class="font-semibold line-clamp-2"> ${data.name} </div>
                                    <div class="flex space-x-2 items-center text-sm pt-3">
                                        <div> ${data.duration} giờ </div>
                                        <div>·</div>
                                        <div>26 lectures </div>
                                    </div>
                                    <div class="pt-1 flex items-center justify-between">
                                        <div class="text-sm font-semibold"> ${data.createdBy} </div>
                                        <div class="text-lg font-semibold"> ${formatCurrency(data.price)} </div>
                                    </div>
                                </div>
                            </div>
                        </a>
                        <div class="popup-content">
                            <div class="popup-arrow"></div>
                            <div class="popup-body">
                                <strong>${data.name}</strong>
                                 <div class="flex space-x-2 items-center text-sm pt-3">
                                        <div> ${data.duration} giờ </div>
                                        <div>·</div>
                                        <div> ${data.levelName} </div>
                                 </div>
                                <ul id="benefit_list_${data.id}"></ul>
                               <div class="popup-actions">
                             <button class="btn-add-to-cart" onclick="addCourseInCart(this)" data-id="${data.id}">
    <span class="icon-heart"></span> Thêm vào giỏ hàng
</button>



                                <i style="font-size: 28px" class="fa-solid fa-heart icon-heart"></i> <!-- Thêm lớp icon-heart -->
                            </div>
                            </div>
                        </div>
                    </div>`;

                    list_course.append(courseHtml);
                    renderBenefit(data.benefit, listId);
                }
                console.log(response);

                let totalPage = response.data.totalPages;
                let currentPage = response.data.pageable.pageNumber;
                if (totalPage > 0) {
                    $("#pageId").empty();
                    let pages = `<li class="page-item"><a class="page-link" onclick="changePage(${currentPage - 1}, 9, event)" href="#"> < </a></li>`;
                    for (let i = 0; i < totalPage; i++) {
                        if (currentPage === i) {
                            pages += `<li class="page-item active"><a class="page-link" onclick="changePage(${i}, 9, event)" href="#">${i + 1}</a></li>`;
                        } else {
                            pages += `<li class="page-item"><a class="page-link" onclick="changePage(${i}, 9, event)" href="#">${i + 1}</a></li>`;
                        }
                    }
                    pages += `<li class="page-item"><a class="page-link" onclick="changePage(${currentPage + 1}, 9, event)" href="#"> > </a></li>`;
                    $("#pageId").append(pages);
                }
            }
        })
    }

    function renderBenefit(benefit, listId) {
        const listElement = document.getElementById(listId);

        if (listElement) { // Kiểm tra phần tử có tồn tại không
            listElement.innerHTML = ''; // Xóa nội dung cũ trước khi thêm mới
            if (benefit) {
                const benefitArray = benefit.split('\n');
                benefitArray.forEach(item => {
                    const listItem = document.createElement('li');
                    const icon = document.createElement('i');
                    icon.className = "uil-check text-xl font-bold mr-2";

                    listItem.appendChild(icon);
                    listItem.appendChild(document.createTextNode(item));
                    listElement.appendChild(listItem);
                });
            } else {
                console.error("Benefits are not available");
            }
        } else {
            console.error("Element with id '" + listId + "' not found");
        }
    }



    function getLevel() {
        let levels = $('#level_list');
        levels.empty();
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/level/list",
            dataType: "json",
            success: function (response) {
                let levelData = response.data;
                $.ajax({
                    type: "POST",
                    url: "http://localhost:8080/api/course/count-by-level",
                    contentType: "application/json",
                    data: JSON.stringify([1, 2, 3, 4]),
                    dataType: "json",
                    success: function (countResponse) {
                        let countData = countResponse.data;

                        for (let i = 0; i < levelData.length; i++) {
                            let data = levelData[i];
                            let count = countData.find(c => c.levelId === data.id)?.courseCount || 0;
                            let radio = '<div class="radio">' +
                                '<input id="radio-' + data.id + '" name="radio" type="radio" value="' + data.id + '">' +
                                '<label for="radio-' + data.id + '"><span class="radio-label"></span> ' + data.name + ' <span> (' + count + ') </span>' +
                                '</label>' +
                                '</div>';
                            levels.append(radio);
                        }
                        $('input[name="radio"]').on('click', function() {
                            const levelId = $(this).val();
                            seacrchForm.levelId = levelId
                            getCourseBySubCategoryId(0,9,seacrchForm);                        });
                    },
                    error: function (error) {
                        console.error(error);
                    }
                });
            },
            error: function (error) {
                console.error(error);
            }
        });
    }

    function getSubCate() {
        let list_sub = $('#list_subCate')
        list_sub.empty()
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/category/getSub",
            dataType: "json",
            success: function (response) {
                let subCate = response.data;
                console.log('sub', subCate)
                for (let i = 0; i < subCate.length; i++) {
                    let data = subCate[i];
                    let row = '<option class="select_option" value="' + data.id + '">' + data.name + '</option>';
                    list_sub.append(row)
                }

                list_sub.on('change', function() {
                    var selectedId = $(this).val();
                    seacrchForm.categoryId = selectedId
                    getCourseBySubCategoryId(0,9,seacrchForm);
                })
            }
        })
    }
    function getLanguage(page,size) {
        let language = $('#list_language');
        language.empty();
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/language/list?page=" + page + "&size=" + size,
            dataType: "json",
            success: function (response) {
                let languages = response.data.content;
                for (let i = 0; i < languages.length; i++) {
                    let data = languages[i];
                    let row = '<option value="' + data.id + '">' + data.name + '</option>';
                    language.append(row);
                }

                let totalPage = response.data.totalPages;
                let currentPage = response.data.pageable.pageNumber;
                if (totalPage > 0) {
                    $("#pageId").empty();
                    let pages = '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage - 1) + ',9,event)" href="#"> < </a></li>';
                    for (let i = 0; i < totalPage; i++) {
                        if (currentPage === i) {
                            pages += '<li class="page-item active"><a class="page-link" onclick="changePage(' + i + ',9,event)" href="#">' + (i + 1) + '</a></li>';
                        } else {
                            pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + i + ',9,event)" href="#">' + (i + 1) + '</a></li>';
                        }
                    }
                    pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage + 1) + ',9,event)" href="#"> > </a></li>';
                    $("#pageId").append(pages);
                }

                language.on('change', function() {
                    var languageId = $(this).val();
                    seacrchForm.languageId = languageId
                    console.log('id language',languageId)
                    getCourseBySubCategoryId(0,9,seacrchForm);
                })
            },
            error: function (error) {
                console.error(error);
            }
        });
    }

    function getCourseBySubCategoryId(page,size, ...seacrchForm){
        let list_course = $('#listCourse');
        list_course.empty();
        let url = "http://localhost:8080/api/course/findCourseByCategoryId?"+ "&page=" + page + "&size=" + size;
        for (const key in seacrchForm[0]) {
            url+= `&${key}=${seacrchForm[0][key]}`
        }

        $.ajax({
            type: "GET",
            url: url,
            dataType: "json",
            success: function (response) {
                let course = response?.data?.content;
                for (let i = 0; i < course.length; i++) {
                    let data = course[i];
                    let courseHtml = '<a href="/course/detail_course?id=' + data.id + '" class="uk-link-reset">' +
                        '<div class="card uk-transition-toggle">' +
                        '<div class="card-media h-40">' +
                        '<div class="card-media-overly"></div>' +
                        '<img src="' + (data.imageFile.length > 0 ? 'data:image/png;base64,' + data.imageFile[0] : '../assets/images/courses/img-5.jpg') + '" alt="" class="">' +
                        '</div>' +
                        '<div class="card-body p-4">' +
                        '<div class="font-semibold line-clamp-2"> ' + data.name + ' </div>' +
                        '<div class="flex space-x-2 items-center text-sm pt-3">' +
                        '<div> ' + data.duration + ' giờ </div>' +
                        '<div>·</div>' +
                        '<div>26 lectures </div>' +
                        '</div>' +
                        '<div class="pt-1 flex items-center justify-between">' +
                        '<div class="text-sm font-semibold"> ' + data.createdBy + '  </div>' +
                        '<div class="text-lg font-semibold"> ' + formatCurrency(data.price) + ' </div>' +
                        '</div>' +
                        '</div>' +
                        '</div>' +
                        '</a>';
                    list_course.append(courseHtml);
                }
                let totalPage = response.data.totalPages;
                let currentPage = response.data.pageable.pageNumber;
                if (totalPage > 0) {
                    $("#pageId").empty();
                    let pages = '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage - 1) + ',9,event)" href="#"> < </a></li>';
                    for (let i = 0; i < totalPage; i++) {
                        if (currentPage === i) {
                            pages += '<li class="page-item active"><a class="page-link" onclick="changePage(' + i + ',9,event)" href="#">' + (i + 1) + '</a></li>';
                        } else {
                            pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + i + ',9,event)" href="#">' + (i + 1) + '</a></li>';
                        }
                    }
                    pages += '<li class="page-item"><a class="page-link" onclick="changePage(' + (currentPage + 1) + ',9,event)" href="#"> > </a></li>';
                    $("#pageId").append(pages);
                }
                console.log(response);
            },
            error: function (error) {
                console.error(error);
            }
        });
    }
    $('#clearAll').on('click', function() {
        getAllCourse(0,9)
        $('#level_list input[type="radio"]').prop('checked', false);
        $('#list_subCate').val('').selectpicker('refresh');
        $('#list_language').val('').selectpicker('refresh');
    })
    function changePage(page, size, event) {
        event.preventDefault();
        getAllCourse(page, size);
        getLanguage(page,size);

        getCourseBySubCategoryId(page,size, ...seacrchForm)
    }
    function addCourseInCart(button) {
        var courseId = $(button).data('id');
        console.log('ID khoa hoc:', courseId);

        var formData = {
            courseId: courseId
        };

        $.ajax({
            type: "POST",
            url: "http://localhost:8080/api/cart/add",
            contentType: "application/json",
            data: JSON.stringify(formData),
            dataType: "json",
            success: function(response) {
                if (response.code === 200) {
                    UIkit.notification({
                        message: 'Thêm sản phẩm thành công!',
                        status: 'success',
                        timeout: 3000
                    });
                    countCourse();

                } else if (response.code === 409) {
                    console.log('Lỗi:', response.message);
                    UIkit.notification({
                        message: 'Sản phẩm đã có trong giỏ hàng!',
                        status: 'warning',
                        timeout: 3000
                    });
                } else if (response.code === 404) {
                    console.log('Lỗi:', response.message);
                } else {
                    console.log('Lỗi:', response.message);
                }
            },
            error: function(error) {
                console.log('Lỗi:', error);
            }
        });
    }

    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'}).format(amount);
    }
</script>
<style>
    .pagination {
        display: flex;
        justify-content: center;
        list-style: none;
        padding: 0;
        margin: 20px 0; /* Space above and below pagination */
    }

    .pagination li {
        margin: 0 5px; /* Space between items */
    }

    .pagination a {
        text-decoration: none;
        padding: 10px 15px;
        background-color: #007bff; /* Primary color */
        color: white;
        border-radius: 5px;
        transition: background-color 0.3s, transform 0.2s;
    }

    .pagination a:hover {
        background-color: #0056b3; /* Darker shade on hover */
        transform: scale(1.05); /* Slightly enlarge on hover */
    }

    .pagination .active a {
        background-color: #0056b3; /* Active page color */
        color: white;
        pointer-events: none; /* Disable clicking on the active page */
    }


    .course-container {
        position: relative;
        display: inline-block;
    }

    .popup-content {
        position: absolute;
        top: 0;
        left: 100%; /* Đặt popup bên phải khóa học */
        margin-left: 20px; /* Khoảng cách giữa khóa học và popup */
        width: 300px;
        background: #fff;
        padding: 15px;
        border: 1px solid #ddd; /* Màu border cho phù hợp */
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
        z-index: 10;
        /* Đặt chiều cao và căn chỉnh cho thân popup */
        display: flex;
        flex-direction: column;
    }

    .course-container:hover .popup-content {
        opacity: 1;
        visibility: visible;
    }

    .popup-arrow {
        position: absolute;
        top: 150px; /* Điều chỉnh vị trí của mũi tên để phù hợp */
        left: -15px; /* Đặt mũi tên nằm bên trái popup, kéo dài ra hơn */
        width: 0;
        height: 0;
        border-top: 10px solid transparent; /* Phần trên của mũi tên */
        border-bottom: 10px solid transparent; /* Phần dưới của mũi tên */
        border-right: 15px solid #f8f9fa; /* Phần bên phải của mũi tên, điều chỉnh màu nền của popup */
    }

    .popup-body {
        display: flex;
        flex-direction: column;
        gap: 10px; /* Khoảng cách giữa các phần tử trong popup */
    }

    .popup-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
    }

    .btn-add-to-cart {
        display: flex;
        align-items: center;
        background-color: #007bff;
        color: #fff;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
    }

    .btn-add-to-cart:hover {
        background-color: #0056b3; /* Màu nền khi hover */
    }

    .btn-add-to-cart .icon-heart {
        font-size: 20px;
        margin-right: 8px;
    }
    /* Mặc định: Màu của biểu tượng trái tim */
    .icon-heart {
        color: gray; /* Màu mặc định của trái tim */
        cursor: pointer;
        font-size: 28px;
        transition: color 0.3s; /* Hiệu ứng chuyển màu mượt mà */
    }

    /* Màu của biểu tượng trái tim khi nhấp vào */
    .icon-heart.active {
        color: red; /* Màu đỏ khi được chọn */
    }


</style>
</body>
</html>
