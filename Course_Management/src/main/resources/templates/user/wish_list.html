<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="user/common/head :: head"></head>
<body>
<div id="wrapper" class="horizontal">
    <div th:replace="user/common/header :: header"></div>
    <div class="max-w-6xl mx-auto lg:mt-10 relative">
        <div class="tube-card mt-3 lg:mx-0 -mx-5">

            <h4 class="py-3 px-5 border-b font-semibold text-grey-700">
                <ion-icon name="star" role="img" class="md hydrated" aria-label="star"></ion-icon>
                Featured today
            </h4>

            <div class="divide-y" id="listCourseWishList">

            </div>

        </div>


    </div>
    <div th:replace="user/common/footer :: footer"></div>
</div>
<div th:replace="user/common/script :: script"></div>
<script>
    $(document).ready(function () {
        init()
    })

    function init() {
        let page = 0;
        let size = 7
        getCourseWishList(page, size)
    }

    function getCourseWishList(page, size) {
        let bodyTable = $('#listCourseWishList');
        bodyTable.empty();
        $.ajax({
            type: "GET",
            url: "http://localhost:8080/api/course/list/wishlist?page=" + page + "&size=" + size,
            dataType: "json",
            success: function (response) {
                console.log('data wishlist', response);
                let courseWishList = response?.data?.content;
                for (let i = 0; i < courseWishList.length; i++) {
                    let data = courseWishList[i];
                    let wishListHtml = ' <div class="flex md:space-x-6 space-x-3 md:p-5 p-2 relative">' +
                        '          <a href="course-intro-2.html" class="md:w-60 md:h-36 w-28 h-20 overflow-hidden rounded-lg relative shadow-sm">' +
                        '            <img src="' + (data.imageFile.length > 0 ? 'data:image/png;base64,' + data.imageFile[0] : '../assets/images/courses/img-5.jpg') + '" alt="" class="w-full h-full absolute inset-0 object-cover">' +
                        '          </a>' +
                        '          <div class="flex-1 md:space-y-2 space-y-1">' +
                        '            <a href="course-intro-2.html" class="md:text-xl font-semibold line-clamp-2"> ' + data.name + ' </a>' +
                        '            <p class="leading-6 pr-4 line-clamp-2 md:block hidden">' + data.shortDescription + ' </p>' +
                        '            <a href="#" class="md:font-semibold block text-sm"> ' + data.createdBy + '</a>' +
                        '            <div class="flex items-center justify-between">' +
                        '              <div class="flex space-x-2 items-center text-sm">' +
                        '                <div> ' + data.levelName + '  </div>' +
                        '                <div class="md:block hidden">·</div>' +
                        '                <div class="flex items-center"> ' + data.duration + ' Giờ </div>' +
                        '              </div>' +
                        '              <a href="#" class="md:flex items-center justify-center h-9 px-8 rounded-md border -mt-3.5 hidden"> Enroll Now </a>' +
                        '            </div>' +
                        '' +
                        '            <div class="absolute top-1 right-3 md:flex hidden">' +
                        '              <a href="#" class="hover:bg-gray-200 p-1.5 inline-block rounded-full" aria-expanded="false">' +
                        '                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6">' +
                        '                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"></path>' +
                        '                </svg>' +
                        '              </a>' +
                        '              <div class="bg-white w-56 shadow-md mx-auto p-2 mt-12 rounded-md text-gray-500 hidden text-base border border-gray-100 dark:bg-gray-900 dark:text-gray-100 dark:border-gray-700 uk-drop uk-drop-top-right" uk-drop="mode: hover;pos: top-right" style="left: -188px; top: -294.4px;">' +
                        '' +
                        '                <ul class="space-y-1">' +
                        '                  <li>' +
                        '                    <a href="#" class="flex items-center px-3 py-2 hover:bg-gray-200 hover:text-gray-800 rounded-md dark:hover:bg-gray-800">' +
                        '                      <i class="uil-share-alt mr-1"></i> Share' +
                        '                    </a>' +
                        '                  </li>' +
                        '                  <li>' +
                        '                    <a href="#" class="flex items-center px-3 py-2 hover:bg-gray-200 hover:text-gray-800 rounded-md dark:hover:bg-gray-800">' +
                        '                      <i class="uil-edit-alt mr-1"></i>  Edit Post' +
                        '                    </a>' +
                        '                  </li>' +
                        '                  <li>' +
                        '                    <a href="#" class="flex items-center px-3 py-2 hover:bg-gray-200 hover:text-gray-800 rounded-md dark:hover:bg-gray-800">' +
                        '                      <i class="uil-comment-slash mr-1"></i>   Disable comments' +
                        '                    </a>' +
                        '                  </li>' +
                        '                  <li>' +
                        '                    <a href="#" class="flex items-center px-3 py-2 hover:bg-gray-200 hover:text-gray-800 rounded-md dark:hover:bg-gray-800">' +
                        '                      <i class="uil-favorite mr-1"></i>  Add favorites' +
                        '                    </a>' +
                        '                  </li>' +
                        '                  <li>' +
                        '                    <hr class="-mx-2 my-2 dark:border-gray-800">' +
                        '                  </li>' +
                        '                  <li>' +
                        '                    <a href="#" class="flex items-center px-3 py-2 text-red-500 hover:bg-red-100 hover:text-red-500 rounded-md dark:hover:bg-red-600">' +
                        '                      <i class="uil-trash-alt mr-1"></i>  Delete' +
                        '                    </a>' +
                        '                  </li>' +
                        '                </ul>' +
                        '' +
                        '              </div>' +
                        '            </div>' +
                        '' +
                        '          </div>' +
                        '        </div>';
                    bodyTable.append(wishListHtml);
                }
            }
        })
    }
</script>
</body>
</html>
